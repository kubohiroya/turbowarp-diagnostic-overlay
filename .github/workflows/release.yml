name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@11.11.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Create ZIP archive
        run: |
          cd dist
          zip ../turbowarp-diagnostic-overlay.zip diagnostic-overlay.js
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/diagnostic-overlay.js
            turbowarp-diagnostic-overlay.zip
